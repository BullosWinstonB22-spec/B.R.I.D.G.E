name: Deploy B.R.I.D.G.E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & deploy frontend to Firebase Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (env vars from GitHub Secrets)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        # Vite loads VITE_* from process.env when present; write frontend.env as fallback
        run: |
          mkdir -p ../.env
          printf 'VITE_API_URL=%s\nVITE_FIREBASE_API_KEY=%s\nVITE_FIREBASE_AUTH_DOMAIN=%s\nVITE_FIREBASE_PROJECT_ID=%s\nVITE_FIREBASE_STORAGE_BUCKET=%s\nVITE_FIREBASE_MESSAGING_SENDER_ID=%s\nVITE_FIREBASE_APP_ID=%s\n' \
            "$VITE_API_URL" "$VITE_FIREBASE_API_KEY" "$VITE_FIREBASE_AUTH_DOMAIN" \
            "$VITE_FIREBASE_PROJECT_ID" "$VITE_FIREBASE_STORAGE_BUCKET" \
            "$VITE_FIREBASE_MESSAGING_SENDER_ID" "$VITE_FIREBASE_APP_ID" > ../.env/frontend.env
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRIDGE }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          entryPoint: frontend

  # Backend is auto-deployed by Render on every push (GitHub integration).
  # Optional: trigger a Render deploy immediately via its deploy hook.
  deploy-backend:
    name: Trigger Render backend deploy
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: Call Render deploy hook
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
