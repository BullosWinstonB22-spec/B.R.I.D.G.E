# Render Blueprint — auto-creates the Django backend + PostgreSQL database.
# In Render: New > Blueprint > connect this repo.
databases:
  - name: bridge-postgres
    databaseName: bridge_db
    user: bridge_user
    plan: free
    region: singapore
    ipAllowList: []            # internal-only connections (more secure)

services:
  - type: web
    name: bridge-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn bridge_core.wsgi:application --log-file -"
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bridge-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # Set CORS_ALLOWED_ORIGINS to your Firebase hosting URL, e.g.:
      # https://bridge-barangay.web.app,https://bridge-barangay.firebaseapp.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
